<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Cheat Sheet</title>
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-line quarter note, a switchable best-card view, the compact editable grid, fine print folded away. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#13202A; --muted:#566774; --line:#DAE2E8;
  --accent:#0B6E6A; --accent-ink:#FFFFFF; --accent-soft:#DDF1EF; --warn:#8A5200; --warn-soft:#FBEFD9;
  --font-display:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1418; --surface:#141E24; --ink:#E5EEF2; --muted:#92A4B0; --line:#25343D;
    --accent:#4FC4BD; --accent-ink:#06201E; --accent-soft:#123B3A; --warn:#F0B45A; --warn-soft:#3A2C12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#141E24; --ink:#E5EEF2; --muted:#92A4B0; --line:#25343D;
  --accent:#4FC4BD; --accent-ink:#06201E; --accent-soft:#123B3A; --warn:#F0B45A; --warn-soft:#3A2C12; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14.5px; line-height:1.4;
  padding-block:24px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
h1{font-size:26px;line-height:1.1}
h3{font-size:15px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font-size:13px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status{font-size:12.5px;color:var(--muted);min-width:64px;text-align:right}
.status.err{color:var(--warn)}
.spend{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.spend input,.cpp{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-family:var(--font-data);font-size:13px;padding:5px 7px;width:70px}

.banner{background:var(--warn-soft);border-radius:8px;padding:8px 14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:14px}
.banner b{color:var(--warn);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.banner .ed{padding:0;min-height:0;flex:1 1 280px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pick{background:var(--bg);border-radius:8px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.pick .cat{font-size:11.5px;color:var(--muted)}
.pick .who{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.pick .how{font-family:var(--font-data);font-size:12.5px;color:var(--accent);overflow-wrap:anywhere}
.pick.none .who{color:var(--muted);font-weight:500;font-size:13.5px}
.bycard{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.bc{background:var(--bg);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bc h3{overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.q{background:var(--warn-soft);color:var(--warn)}
.none{color:var(--muted);font-size:13px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:940px;font-size:13.5px}
th,td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;text-align:left;background:var(--surface)}
th:last-child,td:last-child{border-right:0}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
thead th{position:relative;background:var(--bg)}
.ed{display:block;padding:8px 10px;min-height:34px;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;cursor:text}
.ed:focus{background:var(--accent-soft)}
.colhead .ed{font-weight:500;font-size:12.5px;padding-right:26px}
.rowhead{position:sticky;left:0;z-index:1;min-width:170px;max-width:200px}
thead th:first-child{position:sticky;left:0;z-index:2;min-width:170px}
.rowhead .ed{font-weight:500;padding-right:26px;padding-bottom:2px;min-height:0}
.rowtools,.coltools{display:flex;align-items:center;gap:4px;padding:0 8px 6px;flex-wrap:wrap}
.rowtools small{color:var(--muted);font-size:11px;margin-left:2px}
.rowtools .cpp{width:50px;padding:2px 5px;font-size:12px}
.mv{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;font-size:10px;line-height:1;padding:4px 6px}
.mv:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.mv:disabled{opacity:.3;cursor:default}
td.cell{position:relative;min-width:128px}
td.cell.best{background:var(--accent-soft)}
td.cell.best .ed{color:var(--accent);font-weight:500}
td.cell .usd{display:block;padding:0 10px 7px;font-family:var(--font-data);font-size:11.5px;color:var(--muted);margin-top:-3px;min-height:0}
td.cell .usd:empty{display:none}
td.cell.best .usd{color:var(--accent)}
.star{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:6px;border:0;background:transparent;color:var(--muted);font-size:14px;line-height:1;padding:0;opacity:0}
td.cell:hover .star,td.cell:focus-within .star,.star[aria-pressed="true"]{opacity:1}
.star[aria-pressed="true"]{color:var(--accent)}
@media (hover:none){.star{opacity:.55}.star[aria-pressed="true"]{opacity:1}.rm{opacity:.55}}
.rm{position:absolute;top:6px;right:4px;border:0;background:transparent;color:var(--muted);font-size:12px;border-radius:6px;padding:2px 5px;opacity:0}
th:hover .rm,th:focus-within .rm,.rm[data-armed="1"]{opacity:1}
.rm[data-armed="1"]{color:var(--warn);background:var(--warn-soft)}
:root{--g:#1B7F3B;--g-soft:#DFF3E4;--o:#A85A00;--o-soft:#FDE6CC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g:#6FD99A;--g-soft:#12351F;--o:#F2A04A;--o-soft:#3B2410}}
:root[data-theme="dark"]{--g:#6FD99A;--g-soft:#12351F;--o:#F2A04A;--o-soft:#3B2410}
td.cell.t1{background:var(--g-soft)}
td.cell.t1 .ed,td.cell.t1 .usd{color:var(--g);font-weight:500}
td.cell.t2{background:var(--o-soft)}
td.cell.t2 .ed,td.cell.t2 .usd{color:var(--o);font-weight:500}
.autotag{display:block;border:0;background:transparent;padding:0 10px 4px;font:inherit;font-size:11px;color:var(--accent);text-align:left;cursor:default}
button.autotag{cursor:pointer;text-decoration:underline dotted}
.autotag.warn{color:var(--warn)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px}
.modal .sheet{margin-top:8vh;width:min(420px,100%);max-height:80vh;display:flex;flex-direction:column;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px}
.modal h2{margin:0;font-size:16px}
.modal input{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:8px 10px}
.pk-list{overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:60px}
.pk-item{text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;cursor:pointer}
.pk-item:hover,.pk-item:focus-visible{background:var(--accent-soft);color:var(--accent)}
.pk-item.custom{font-weight:600}
.pk-note{margin:0;font-size:12px;color:var(--muted)}
.cpick{box-shadow:inset 0 0 0 1.5px var(--accent)}
.citi{margin-bottom:12px;font-size:13px;line-height:1.45;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.citi b{color:var(--fg)}
.sortbtn{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;cursor:pointer;padding:2px 4px;margin-left:4px;border-radius:6px}
.sortbtn:hover,.sortbtn:focus-visible{color:var(--accent)}
.sortbtn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.info{border:1px solid var(--muted);background:transparent;color:var(--muted);width:17px;height:17px;border-radius:50%;font:italic 600 11px/1 serif;cursor:pointer;padding:0;margin-left:6px;vertical-align:middle}
.info:hover,.info:focus-visible{color:var(--accent);border-color:var(--accent)}
.pop{position:fixed;z-index:50;max-width:min(320px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--muted);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.45;white-space:pre-line;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pop b{display:block;margin-bottom:6px}
.hiddenbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
.hiddenbar .chip{border:0;cursor:pointer;font:inherit;font-size:12px}
.empty{padding:24px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

details.fine{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.fine summary{cursor:pointer;font-weight:500;font-size:14px}
.fine .items{display:flex;flex-direction:column;margin-top:8px}
.fine .item{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;border-top:1px solid var(--line);padding:6px 0;font-size:13px}
.fine .item b{font-weight:500}
.fine .item .ed{padding:0;min-height:0;color:var(--muted)}
@media (max-width:560px){h1{font-size:23px}.fine .item{grid-template-columns:1fr;gap:2px}}
</style>

<div class="wrap">
  <header>
    <h1>Card Cheat Sheet</h1>
    <div class="tools">
      <label class="spend">Spend $<input id="spend" type="number" min="1" step="1" value="100" inputmode="decimal" aria-label="Spend amount in dollars"></label>
      <span class="status" id="status" role="status"></span>
      <button class="btn" id="refresh" type="button" title="Update the percentages from the latest rates file">Refresh rates</button>
      <button class="btn" id="add-card" type="button" hidden>Add card</button>
      <button class="btn" id="add-cat" type="button" hidden>Add category</button>
      <button class="btn" id="dl" type="button" hidden>CSV</button>
      <button class="btn" id="backup" type="button">Backup</button>
      <button class="btn" id="restore" type="button">Restore</button>
      <input type="file" id="restore-file" accept="application/json,.json" hidden>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div id="views"></div>

  <section class="panel">
    <div id="grid"><div class="empty">Loading your sheet…</div></div>
  </section>

  <div id="fine-wrap"></div>
</div>

ian": "", "r_zolve__c_online": "", "r_zolve__c_other": "", "r_zolve__c_travel": "", "r_zolve__c_wc": ""}, "cols": [{"id": "c_dining", "name": "Dining"}, {"id": "c_indian", "info": "Amex 3% applies only to U.S. supermarkets. Amex says superstores, convenience stores, warehouse clubs and meal-kit delivery services are not supermarkets. Merchants are coded by what they mainly sell, so a small Indian grocery usually counts only if it is coded as a supermarket. Check one purchase in your Amex app. Citi Custom Cash 5% groceries has similar exclusions.", "name": "Indian grocery store"}, {"id": "c_wc", "info": "Walmart is a superstore, so it does not earn Amex 3% supermarket cash back or Citi 5% groceries. Walmart.com may be coded as online retail (Amex 3% online), which I could not confirm.\n\nCostco warehouses accept Visa only, so Mastercard, Discover and Amex cards do not work in store.", "name": "Walmart / Costco"}, {"id": "c_gas", "name": "Gas"}, {"id": "c_travel", "name": "Travel portal"}, {"id": "c_online", "info": "Amex Blue Cash Everyday 3% on U.S. online retail, up to $6,000 a year, then 1%.\n\nCounts: online purchases from U.S. retailers whose merchant code is retail.\n\nDoes not count (Amex terms): restaurants, supermarkets, gas stations, auto dealers, and purchases of travel, entertainment or other services. So no flights, hotels, streaming, tickets, food delivery or grocery delivery.\n\nMerchants are coded by what they mainly sell. A purchase earns no bonus if its code is not in the category. Every other card here earns its normal rate online.", "name": "Online Shopping"}, {"id": "c_other", "name": "Everything Else"}], "fine": "Rates checked on each issuer's site on Nov 4, 2026. Costco warehouses take Visa only, so Apple Card, Zolve, Custom Cash, Discover and Amex don't work there. Dollar amounts show the top rate and ignore caps.", "notes": {"r_apple": "3% also at Apple, Nike, Uber and Uber Eats. 1% with the titanium card or card number.", "r_bce": "3% categories cap at $6,000 per year each, then 1%. 2.7% foreign fee. Walmart likely isn't a supermarket here, so check your card terms.", "r_ccc": "5% on your top eligible category each cycle, first $500 only. Superstores and warehouse clubs are excluded from groceries.", "r_cfu": "3% on drugstores too. 100 points = $1.", "r_csr": "$795 annual fee. 5x on Lyft through 9/30/2027.", "r_disc": "5% needs activation each quarter and is capped at $1,500 combined. Discover's own pages didn't show the Q4 list, so confirm it in the app.", "r_vx": "$395 annual fee. No foreign transaction fee.", "r_zolve": "Classic card, 1 point per $1. Signature and Black pay more on 3 or 5 brands you choose."}, "quarter": {"card": "r_disc", "text": "Q4 (Oct 1 to Dec 31): Discover pays 5% on restaurants, entertainment and utilities. Activate first."}, "rows": [{"cpp": 1, "hidden": true, "id": "r_zolve", "name": "Zolve Credit Card"}, {"hidden": true, "id": "r_apple", "name": "Apple Card"}, {"id": "r_cfu", "name": "Chase Freedom Unlimited"}, {"cpp": 1, "id": "r_csr", "name": "Chase Sapphire Reserve"}, {"id": "r_disc", "name": "Discover it"}, {"cpp": 1, "id": "r_vx", "name": "Capital One Venture X"}, {"id": "r_bce", "name": "Amex Blue Cash Everyday"}, {"id": "r_ccc", "name": "Citi Custom Cash", "topcat": true}], "spend": 100};

    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);

  function parseRates(text){

    while ((m = re.exec(text || ''))){ out.push({ v: parseFloat(m[1]), unit: m[2] === '%' ? '%' : 'x' }); }
    return out;
  }
  function money(x){ return x % 1 === 0 ? '$' + x : '$' + x.toFixed(2); }
  function usd(text, row, long){
    var rates = parseRates(text);
    if (!rates.length) return '';
    var cpp = row && typeof row.cpp === 'number' && row.cpp > 0 ? row.cpp : 0;
    var pcts = [], needs = false;
    rates.forEach(function(r){
      if (r.unit === '%') pcts.push(r.v); else if (cpp) pcts.push(r.v * cpp); else needs = true;
    });
    if (!pcts.length) return needs ? 'set point value' : '';
    var max = Math.max.apply(null, pcts), seen = {};
    pcts.forEach(function(p){ seen[Math.round(p*1000)] = 1; });
    var s = (Object.keys(seen).length > 1 ? 'up to ' : '') + money(Math.round(data.spend * max) / 100);
    return long ? s + ' per ' + money(data.spend) : s;
  }
  // Best rate in a cell as a percent of spend (-1 when there is no rate).
  function rateOf(text, row){
    var cpp = row && typeof row.cpp === 'number' && row.cpp > 0 ? row.cpp : 0, best = -1;
    parseRates(text).forEach(function(r){
      var p = r.unit === '%' ? r.v : (cpp ? r.v * cpp : -1);
      if (p > best) best = p;
    });
    return best;
  }
  // Cards flagged topcat (Citi Custom Cash) pay 5% on one auto-picked category.
  // Find the category where that 5% beats the next-best card by the most.
  function citiPick(){
    var row = vis().filter(function(r){ return r.topcat; })[0];
    if (!row) return null;
    var found = [], top = 0;
    calcCols().forEach(function(c){
      var mine = rateOf(data.cells[key(row.id, c.id)], row);
      if (mine <= 0) return;
      var other = 0;
      vis().forEach(function(r){ if (r.id !== row.id) other = Math.max(other, rateOf(data.cells[key(r.id, c.id)], r)); });
      var gain = mine - other;
      if (gain > top + 0.001){ top = gain; found = [c]; } else if (gain > 0 && Math.abs(gain - top) < 0.001){ found.push(c); }
    });
    return { row: row, cols: found, gain: top };
  }
  // Per column: tier 1 = highest rate (green), tier 2 = next highest (orange).
  // A top-category card (Citi) only counts where it is the recommended pick.
  function tiers(colId, cp){
    var vals = [];
    vis().forEach(function(r){
      var v = rateOf(data.cells[key(r.id, colId)], r);
      if (r.topcat && !(cp && cp.row.id === r.id && cp.cols.some(function(c){ return c.id === colId; }))) v = -1;
      vals.push({ id: r.id, v: v });
    });
    var distinct = [];
    vals.forEach(function(x){ if (x.v > 0 && distinct.indexOf(x.v) < 0) distinct.push(x.v); });
    distinct.sort(function(a, b){ return b - a; });
    var out = {};
    vals.forEach(function(x){ if (x.v > 0 && x.v === distinct[0]) out[x.id] = 1; else if (x.v > 0 && x.v === distinct[1]) out[x.id] = 2; });
    return out;
  }
  var sortCol = null;
  function sortedRows(){
    var rows = vis().map(function(r, i){ return { r: r, i: i }; });
    if (!sortCol) return rows.map(function(x){ return x.r; });
    rows.forEach(function(x){ x.v = rateOf(data.cells[key(x.r.id, sortCol)], x.r); });
    rows.sort(function(a, b){ return (b.v - a.v) || (a.i - b.i); });
    return rows.map(function(x){ return x.r; });
  }
  function rowUsesPoints(r){
    if (typeof r.cpp === 'number') return true;
    return data.cols.some(function(c){ return parseRates(data.cells[key(r.id, c.id)]).some(function(x){ return x.unit === 'x'; }); });

  }
  function closeModal(){ if (modal){ modal.remove(); modal = null; } }
  function openPicker(kind){
    closeModal();
    var isCard = kind === 'card', list = isCard ? CARD_LIST : CAT_LIST;
    var have = (isCard ? data.rows : data.cols).map(function(x){ return x.name.toLowerCase(); });
    modal = document.createElement('div'); modal.className = 'modal';
    modal.innerHTML = '<div class="sheet" role="dialog" aria-label="' + (isCard ? 'Add a card' : 'Add a category') + '"><h2>' + (isCard ? 'Add a card' : 'Add a category') + '</h2>' +
      '<input type="text" id="pk-q" placeholder="' + (isCard ? 'Search or type a card name' : 'Search or type a category') + '" autocomplete="off">' +
      '<div class="pk-list" id="pk-list"></div>' +
      '<p class="pk-note">' + (sampleFn ? 'Claude fills in the rates for you from what it knows. It cannot browse, so check them against the issuer’s site.' : (isCard ? 'Rates for the cards in this list come from issuer pages read Nov 4, 2026. A card typed by hand starts empty.' : 'Auto-fill is not available in this view. The new column will be empty.')) + '</p></div>';
    document.body.appendChild(modal);
    var q = modal.querySelector('#pk-q'), box = modal.querySelector('#pk-list');
    function draw(){
      var s = q.value.trim().toLowerCase(), html = '';
      var items = list.filter(function(n){ return have.indexOf(n.toLowerCase()) < 0 && (!s || n.toLowerCase().indexOf(s) >= 0); });
      if (s && list.concat(have).every(function(n){ return n.toLowerCase() !== s; })) html += '<button type="button" class="pk-item custom" data-pick="' + esc(q.value.trim()) + '">Add “' + esc(q.value.trim()) + '”</button>';
      html += items.map(function(n){ return '<button type="button" class="pk-item" data-pick="' + esc(n) + '">' + esc(n) + '</button>'; }).join('');
      box.innerHTML = html || '<div class="none">Type a name to add it.</div>';
    }
    draw();
    q.addEventListener('input', draw);
    q.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ var f = box.querySelector('[data-pick]'); if (f) f.click(); } });
    modal.addEventListener('click', function(e){
      if (e.target === modal){ closeModal(); return; }
      var b = e.target.closest('[data-pick]');
      if (b){ var name = b.getAttribute('data-pick'); closeModal(); if (isCard) addCard(name); else addCat(name); }
    });
    setTimeout(function(){ q.focus(); }, 0);
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });
  function fillPrompt(what){
    return 'You are filling a credit card rewards comparison table for a US cardholder. Today is ' + new Date().toISOString().slice(0, 10) + '. ' + what +
      ' Use the issuer’s current official rewards rates as best you know them. Each value is a short string like "3%", "2X", "1.5%", "5% (cap $500)", "4x points" or "3% on up to $6,000 per year". Use an empty string when the card earns only its plain base rate of 1% or 1 point per $1, or when the card is not accepted, or when you are not sure. Reply with only the JSON object.';
  }
  function failFill(id, e){
    delete filling[id];
    var r = data && data.rows.filter(function(x){ return x.id === id; })[0];
    if (r) r.auto = 'failed';
    changed(true);
    if (e && e.code === 'not_granted') setStatus('Auto-fill was not allowed', true);
  }
  function applyKnown(row){
    var k = KNOWN[row.name];
    if (!k){ row.auto = 'failed'; return false; }
    calcCols().forEach(function(c){ var v = k[c.id]; if (typeof v === 'string' && v && !data.cells[key(row.id, c.id)]){ data.cells[key(row.id, c.id)] = v; data.autoVals[key(row.id, c.id)] = v; } });
    if (k.cpp) row.cpp = k.cpp;
    row.auto = 'done';
    return true;
  }
  function fillEmptyKnown(){
    var any = false;
    data.rows.forEach(function(r){
      if (r.auto || !KNOWN[r.name]) return;
      var has = data.cols.some(function(c){ var v = data.cells[key(r.id, c.id)]; return typeof v === 'string' && v.trim(); });
      if (!has && applyKnown(r)) any = true;
    });
    return any;
  }
  // ---- Refresh rates: re-read rates.json (or the built-in table) and update cells you have not edited ----
  var RATES_ASOF = '2026-11-05';
  function asOf(s){ var d = new Date(s + 'T12:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function applyRates(table, label){
    var cells = 0, cards = 0, kept = 0, missing = 0;
    data.rows.forEach(function(r){
      var k = table[r.name];
      if (!k){ if (r.auto) missing++; return; }
      var touched = false;
      calcCols().forEach(function(c){
        if (typeof k[c.id] !== 'string') return;
        var kk = key(r.id, c.id), cur = (data.cells[kk] || '').trim(), prev = data.autoVals[kk];
        var next = k[c.id];
        if (cur === next){ if (next) data.autoVals[kk] = next; return; }
        if (cur === '' || cur === prev){
          if (next) data.cells[kk] = next; else delete data.cells[kk];
          if (next) data.autoVals[kk] = next; else delete data.autoVals[kk];
          cells++; touched = true;
        } else { kept++; }
      });
      if (touched){ cards++; r.auto = 'done'; }
      if (k.cpp && !r.cpp) r.cpp = k.cpp;
    });
    changed(true);
    var msg = cells ? 'Updated ' + cells + ' cell' + (cells === 1 ? '' : 's') + ' on ' + cards + ' card' + (cards === 1 ? '' : 's') : 'Rates already up to date';
    msg += ' (' + label + ')' + (kept ? '. Kept ' + kept + ' you edited' : '');
    setTimeout(function(){ setStatus(msg); }, 900);
  }
  function refreshRates(){
    if (!data) return;
    var btn = $('refresh'); btn.disabled = true; setStatus('Refreshing…');
    var done = function(){ btn.disabled = false; };
    fetch('rates.json?t=' + Date.now(), { cache: 'no-store' }).then(function(res){
      if (!res.ok) throw new Error('http ' + res.status);
      return res.json();
    }).then(function(j){
      if (!j || !j.cards) throw new Error('bad file');
      applyRates(j.cards, 'rates as of ' + asOf(j.updated || RATES_ASOF)); done();
    }).catch(function(){
      applyRates(KNOWN, 'built-in rates as of ' + asOf(RATES_ASOF) + '; rates.json not reachable'); done();
    });
  }
  $('refresh').addEventListener('click', refreshRates);
  function addCard(name){
    var row = { id: uid('r'), name: name };
    data.rows.push(row);
    if (!sampleFn){ applyKnown(row); changed(true); return; }
    filling[row.id] = true; changed(true);
    var cols = calcCols().map(function(c){ return { id: c.id, name: c.name }; });
    var p = fillPrompt('The card is "' + name + '". Categories: ' + JSON.stringify(cols) + '. Return {"cells": {<category id>: <value>, ...}, "cpp": <cents per point as a number if the card earns transferable points or miles, else null>}.');
    sampleFn.json(p, { modelTier: 'default' }).then(function(res){
      var r = data.rows.filter(function(x){ return x.id === row.id; })[0];
      delete filling[row.id];
      if (!r) return;
      var cells = res && res.cells || {};
      cols.forEach(function(c){ var v = cells[c.id]; if (typeof v === 'string' && v.trim() && !data.cells[key(r.id, c.id)]) data.cells[key(r.id, c.id)] = v.trim(); });
      if (res && typeof res.cpp === 'number' && res.cpp > 0) r.cpp = res.cpp;
      r.auto = 'done';
      changed(true);
    }).catch(function(e){ failFill(row.id, e); });
  }
  function addCat(name){
    var at = data.cols.map(function(c){ return c.calc === false; }).indexOf(true);
    var col = { id: uid('c'), name: name };
    if (at < 0) data.cols.push(col); else data.cols.splice(at, 0, col);
    var rows = vis().map(function(r){ return { id: r.id, name: r.name }; });
    if (!sampleFn || !rows.length){ changed(true); return; }
    rows.forEach(function(r){ filling[r.id] = true; });
    changed(true);
    var p = fillPrompt('The new category is "' + name + '". Cards: ' + JSON.stringify(rows) + '. Return {<card id>: <value for this category>, ...}.');
    sampleFn.json(p, { modelTier: 'default' }).then(function(res){
      rows.forEach(function(r){
        delete filling[r.id];
        var v = res && res[r.id];
        if (typeof v === 'string' && v.trim() && !data.cells[key(r.id, col.id)]) data.cells[key(r.id, col.id)] = v.trim();
      });
      changed(true);
    }).catch(function(e){
      rows.forEach(function(r){ delete filling[r.id]; });
      changed(true);
      setStatus('Could not auto-fill the new category', true);
    });
  }

  var popEl = null;
  function hideInfo(){ if (popEl){ popEl.remove(); popEl = null; } }
  function showInfo(btn){
    var id = btn.getAttribute('data-info');
    if (popEl && popEl.getAttribute('data-for') === id){ hideInfo(); return; }
    hideInfo();
    var col = data.cols.filter(function(c){ return c.id === id; })[0];
    if (!col || !col.info) return;
    popEl = document.createElement('div');
    popEl.className = 'pop'; popEl.setAttribute('role', 'dialog'); popEl.setAttribute('data-for', id);
    var t = document.createElement('b'); t.textContent = col.name + ': what counts';
    var p = document.createElement('div'); p.textContent = col.info;
    popEl.appendChild(t); popEl.appendChild(p);
    document.body.appendChild(popEl);
    var r = btn.getBoundingClientRect(), w = popEl.offsetWidth;
    var left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12));
    popEl.style.left = left + 'px';
    popEl.style.top = (r.bottom + 6) + 'px';
  }
  document.addEventListener('click', function(e){ if (popEl && !e.target.closest('.pop')) hideInfo(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideInfo(); });
  window.addEventListener('scroll', hideInfo, true);
  var armedTimer = null;
  wrap.addEventListener('click', function(e){
    if (!data) return;
    var tab = e.target.closest('[data-view]');
    if (tab){ view = tab.getAttribute('data-view'); renderViews(); return; }
    var ca = e.target.closest('[data-clearauto]');
    if (ca){ data.rows.forEach(function(r){ if (r.id === ca.getAttribute('data-clearauto')) delete r.auto; }); changed(true); return; }
    var so = e.target.closest('[data-sort]');
    if (so){ var sid = so.getAttribute('data-sort'); sortCol = sortCol === sid ? null : sid; renderGrid(); return; }
    var inf = e.target.closest('[data-info]');
    if (inf){ e.stopPropagation(); showInfo(inf); return; }
    var hd = e.target.closest('[data-hide]');
    if (hd){ data.rows.forEach(function(r){ if (r.id === hd.getAttribute('data-hide')) r.hidden = true; }); changed(true); return; }
    var sh = e.target.closest('[data-show]');
    if (sh){ data.rows.forEach(function(r){ if (r.id === sh.getAttribute('data-show')) delete r.hidden; }); changed(true); return; }
    var mv = e.target.closest('[data-move]');
    if (mv){ move(mv.getAttribute('data-move'), mv.getAttribute('data-id'), parseInt(mv.getAttribute('data-dir'), 10)); return; }
    var s = e.target.closest('[data-star]');
    if (s){
      var c = s.getAttribute('data-col'), r = s.getAttribute('data-row');
      if (data.best[c] === r) delete data.best[c]; else data.best[c] = r;
      changed(true); return;
    }
    var b = e.target.closest('[data-rm]');
    if (b){
      if (b.getAttribute('data-armed') !== '1'){
        b.setAttribute('data-armed','1'); b.textContent = 'Remove?';
        clearTimeout(armedTimer);
        armedTimer = setTimeout(function(){ if (b.isConnected){ b.removeAttribute('data-armed'); b.textContent = '×'; } }, 3000);
        return;
      }
      var id = b.getAttribute('data-id');
      if (b.getAttribute('data-rm') === 'row'){
        data.rows = data.rows.filter(function(r){ return r.id !== id; });
        Object.keys(data.cells).forEach(function(k){ if (k.indexOf(id + '__') === 0) delete data.cells[k]; });
        Object.keys(data.best).forEach(function(c){ if (data.best[c] === id) delete data.best[c]; });
        delete data.notes[id];
        if (data.quarter && data.quarter.card === id) delete data.quarter.card;
      } else {
        data.cols = data.cols.filter(function(c){ return c.id !== id; });
        Object.keys(data.cells).forEach(function(k){ if (k.slice(-(id.length + 2)) === '__' + id) delete data.cells[k]; });
        delete data.best[id];
      }
      changed(true);
    }
  });

  $('add-card').addEventListener('click', function(){ if (data) openPicker('card'); });
  $('add-cat').addEventListener('click', function(){ if (data) openPicker('cat'); });

  $('dl').addEventListener('click', function(){
    if (!downloads || !data) return;
    function q(s){ s = String(s == null ? '' : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
    var lines = [['Card'].concat(data.cols.map(function(c){ return c.name; })).map(q).join(',')];
    data.rows.forEach(function(r){
      lines.push([r.name].concat(data.cols.map(function(c){ return data.cells[key(r.id, c.id)] || ''; })).map(q).join(','));
    });
    downloads.save({ filename: 'card-cheat-sheet.csv', data: lines.join('\n') }).then(function(){ setStatus('Downloaded'); }, function(e){
      if (e && e.code !== 'declined') setStatus('Download is not available here', true);
    });
  });

  function onSnap(snap){
    loaded = true; clearTimeout(slow);
    if (dirty) return;
    data = norm(snap.exists ? clone(snap.data()) : null);
    if (!sampleFn && fillEmptyKnown()) setTimeout(function(){ changed(true); }, 0);
    if (statusEl.textContent === 'Loading…') setStatus('');
    if (editing()){ pendingRender = true; renderViews(); return; }
    render();
  }

  var slow = setTimeout(function(){ if (!loaded) setStatus("Can't reach your saved sheet yet", true); }, 10000);
  setStatus('Loading…');

  var cl = window.claude;
  if (!cl || !cl.use){
    setStatus('Saving is not available here', true);
    $('grid').innerHTML = '<div class="empty">This view cannot load your saved sheet. Open the page from your Claude artifacts.</div>';
    return;
  }
  Promise.all([cl.use('db'), cl.use('downloads'), cl.use('sample').catch(function(){ return null; })]).then(function(r){
    var db = r[0]; downloads = r[1]; sampleFn = r[2];
    if (!db){
      setStatus('Saving is not available here', true);
      $('grid').innerHTML = '<div class="empty">This view cannot load your saved sheet. Open the page while signed in to Claude.</div>';
      return;
    }
    ref = db.doc(DOC_PATH);
    $('add-card').hidden = false; $('add-cat').hidden = false; $('dl').hidden = !downloads;
    ref.onSnapshot(onSnap, function(e){
      clearTimeout(slow);
      setStatus(e && e.code === 'revoked' ? 'Access changed' : "Can't reach your saved sheet", true);
    });
  });
})();
</script>

</body>
</html>
